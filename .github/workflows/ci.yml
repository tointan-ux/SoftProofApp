name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: 'SoftProof.sln'
  CONFIGURATION: 'Release'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Dependency audit
        shell: pwsh
        # NU1902/NU1903 are no longer exempted in Directory.Build.props; this makes a known
        # vulnerable package fail the build instead of scrolling past in a warning list.
        run: |
          $log = dotnet restore $env:SOLUTION --force 2>&1 | Out-String
          $hits = ($log -split "`n") | Where-Object { $_ -match 'NU190[234]' } | Sort-Object -Unique
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_ }
            throw "Vulnerable package(s) detected."
          }
          Write-Host "No vulnerable packages."

      - name: Documentation gate (CS1591)
        shell: pwsh
        # CONTRIBUTING.md requires XML docs on public APIs. The count is ratcheted: it may fall
        # (a member got documented) but not rise without the baseline being raised on purpose.
        run: |
          $log = dotnet build $env:SOLUTION -c $env:CONFIGURATION --no-restore --no-incremental 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
          $count = (($log -split "`n") | Where-Object { $_ -match 'warning CS1591' } | Sort-Object -Unique).Count
          $baseline = [int]((Get-Content .github/cs1591-baseline.txt -Raw).Trim())
          Write-Host "CS1591 (missing XML docs on public members): $count, baseline $baseline"
          if ($count -gt $baseline) {
            throw "CS1591 went up ($count > $baseline). Document the new public members, or raise the baseline deliberately."
          }

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-build --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  docs:
    name: Build Documentation
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build documentation
        run: |
          docfx docfx.json
        working-directory: .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore(docs): deploy API documentation [skip ci]'

  package:
    name: Package
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Publish UI application
        run: dotnet publish src/SoftProof.UI/SoftProof.UI.csproj -c ${{ env.CONFIGURATION }} -r win-x64 --self-contained false -o ${{ runner.temp }}/publish

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoftProof-${{ env.CONFIGURATION }}-win-x64
          path: ${{ runner.temp }}/publish/**
          retention-days: 30

  codeql:
    name: CodeQL Analysis
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"